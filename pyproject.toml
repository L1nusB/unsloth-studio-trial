[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unsloth-studio-trial"
version = "0.1.0"
description = "Mac-side tooling + notes for trialing Unsloth Studio on RunPod (ports the `pod` CLI)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "loguru>=0.7.3",
    "psutil>=7.0",
]

[project.scripts]
# Mac-side CLI to drive an already-running RunPod pod over direct-TCP SSH.
pod = "runpod_pod.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/runpod_pod"]

[tool.uv]
# Local CLI tool — keep it lean; no extra index/sources needed.
package = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
extraPaths = ["src"]

[tool.ruff]
target-version = "py313"
src = ["src"]
